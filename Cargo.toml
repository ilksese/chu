[package]
name = "chu"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Native Rust + Slint desktop manager for AI coding-agent resources"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
md5 = "0.8"
pulldown-cmark = { version = "=0.13.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
sha2 = "0.10"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
tempfile = "3"
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
